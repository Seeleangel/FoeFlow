<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f4;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 380px;
  }
  h1 {
    margin: 0 0 24px;
    font-size: 22px;
    color: #1c1917;
    text-align: center;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #57534e;
  }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d6d3d1;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: #a8a29e; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #1c1917;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    transition: opacity .2s;
  }
  button:hover { opacity: .9; }
  .error {
    color: #dc2626;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>
<div class="login-card">
  <h1>License Admin</h1>
  <label for="user">Username</label>
  <input id="user" type="text" autocomplete="username">
  <label for="pass">Password</label>
  <input id="pass" type="password" autocomplete="current-password">
  <button id="btn">Login</button>
  <div class="error" id="err">Invalid credentials</div>
</div>
<script>
  const $ = id => document.getElementById(id);
  function utf8ToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  $('btn').addEventListener('click', async () => {
    const user = $('user').value.trim();
    const pass = $('pass').value;
    const auth = 'Basic ' + utf8ToBase64(user + ':' + pass);
    const res = await fetch('/admin/api/stats', { headers: { Authorization: auth } });
    if (res.ok) {
      sessionStorage.setItem('adminAuth', auth);
      location.href = '/admin/dashboard';
    } else {
      $('err').style.display = 'block';
    }
  });
  $('pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('btn').click(); });
</script>
</body>
</html>
