# Add to the same HTTPS server block as foeflow-web.nginx.conf.
# Replace FOEFLOW_MAIL_PORT with the selected loopback port.
location ^~ /foeflow/mail/ {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:FOEFLOW_MAIL_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-FoeFlow-Client $remote_addr;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    proxy_next_upstream off;
    access_log off;
}


# Used by the model relay; the account service never receives model payloads.
location = /foeflow/_account-check {
    internal;
    proxy_pass http://127.0.0.1:FOEFLOW_MAIL_PORT/foeflow/mail/auth;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    access_log off;
}
