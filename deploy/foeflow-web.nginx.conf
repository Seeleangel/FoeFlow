# Include this file inside the HTTPS server block. The release symlink contains
# a foeflow/ directory with the contents of dist-web/.
location = /foeflow {
    return 301 /foeflow/;
}

location ^~ /foeflow/ {
    root /var/www/foeflow-web-current;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' https:; font-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
}

location = /foeflow/_model/chat/completions {
    include /etc/nginx/snippets/foeflow-model-proxy.conf;
    proxy_pass https://chat.ecnu.edu.cn/open/api/v1/chat/completions;
}

location = /foeflow/_model/images/generations {
    include /etc/nginx/snippets/foeflow-model-proxy.conf;
    proxy_pass https://chat.ecnu.edu.cn/open/api/v1/images/generations;
}
