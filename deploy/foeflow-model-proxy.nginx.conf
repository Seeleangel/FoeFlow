# Install as /etc/nginx/snippets/foeflow-model-proxy.conf.
# A signed-in caller must provide their own model credential. Do not log requests or bodies.
if ($request_method != POST) { return 405; }
if ($http_authorization !~ "^Bearer .+") { return 401; }
auth_request /foeflow/_account-check;
client_max_body_size 24m;
proxy_http_version 1.1;
proxy_request_buffering off;
proxy_buffering off;
proxy_connect_timeout 10s;
proxy_read_timeout 125s;
proxy_next_upstream off;
proxy_set_header Host chat.ecnu.edu.cn;
proxy_set_header Connection "";
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie "";
proxy_set_header X-FoeFlow-Workspace "";
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_ssl_server_name on;
proxy_ssl_name chat.ecnu.edu.cn;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_hide_header Set-Cookie;
proxy_hide_header Location;
proxy_hide_header X-Accel-Redirect;
proxy_ignore_headers X-Accel-Redirect;
access_log off;
